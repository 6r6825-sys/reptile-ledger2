<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" shape-rendering="crispEdges">
  <!-- Background with dark retro border -->
  <rect x="0" y="0" width="192" height="192" fill="#12161a" />
  <rect x="6" y="6" width="180" height="180" fill="#1a2026" stroke="#2d3748" stroke-width="4" />
  
  <!-- Scale corner accents -->
  <rect x="12" y="12" width="12" height="12" fill="#39d353" opacity="0.6" />
  <rect x="168" y="12" width="12" height="12" fill="#39d353" opacity="0.6" />
  <rect x="12" y="168" width="12" height="12" fill="#39d353" opacity="0.6" />
  <rect x="168" y="168" width="12" height="12" fill="#39d353" opacity="0.6" />

  <!-- Rock perch -->
  <rect x="24" y="140" width="144" height="20" fill="#4a3e36" />
  <rect x="36" y="148" width="120" height="12" fill="#2d2520" />

  <!-- Tail -->
  <rect x="28" y="118" width="18" height="12" fill="#e5a11d" />
  <rect x="46" y="114" width="18" height="12" fill="#f5b027" />

  <!-- Gecko/Dragon Body (Golden Yellow Pixel Art) -->
  <rect x="64" y="96" width="56" height="42" fill="#f9bf34" />
  <rect x="74" y="100" width="10" height="10" fill="#d98c15" />
  <rect x="94" y="100" width="10" height="10" fill="#d98c15" />
  <rect x="84" y="116" width="12" height="10" fill="#d98c15" />

  <!-- Spikes -->
  <rect x="64" y="132" width="6" height="8" fill="#fae084" />
  <rect x="78" y="136" width="6" height="8" fill="#fae084" />
  <rect x="94" y="136" width="6" height="8" fill="#fae084" />
  <rect x="110" y="132" width="6" height="8" fill="#fae084" />

  <!-- Legs -->
  <rect x="58" y="132" width="14" height="18" fill="#e5a11d" />
  <rect x="104" y="132" width="14" height="18" fill="#e5a11d" />

  <!-- Head -->
  <rect x="120" y="82" width="38" height="34" fill="#f9bf34" />
  <rect x="150" y="90" width="14" height="20" fill="#f9bf34" />
  
  <!-- Beard Spikes -->
  <rect x="120" y="116" width="10" height="10" fill="#d98c15" />
  <rect x="130" y="116" width="10" height="14" fill="#c47a0b" />
  <rect x="140" y="116" width="10" height="10" fill="#d98c15" />

  <!-- Big Pixel Eye (Curious & Happy) -->
  <rect x="134" y="88" width="10" height="10" fill="#ffffff" />
  <rect x="138" y="90" width="6" height="8" fill="#12161a" />
  <rect x="140" y="90" width="2" height="2" fill="#ffffff" />

  <!-- Golden Coin / Accounting Sparkle -->
  <rect x="154" y="52" width="14" height="14" fill="#ffd700" />
  <rect x="158" y="56" width="6" height="6" fill="#fae084" />
